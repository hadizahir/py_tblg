# ======================================================================
# PBC configuration for py_tbl
# Clean commensurate supercell (periodic boundary conditions, no edges)
# Used by: python -m py_tbl.run_pbc --config py_tbl/configs/pbc.yaml
# ======================================================================

paths:
  # separate directory so PBC results don’t overwrite OBC data
  save_dir: ./bands_pbc

build:
  # ------------------------------------------------------------------
  # Moiré geometry: choose commensurate (m, r) pair
  # theta_target_deg is ignored — run_pbc.py computes θ_comm(m,r)
  # ------------------------------------------------------------------
  # Fallback single (m,r) if you want to run just one:
  m: 18
  r: 1
  theta_target_deg: 1.79       # only informational
  hp_values: [1.5]            # interlayer cutoff (in units of acc)
  n_mult_list: [1]             # ignored under PBC (always one supercell)
    # Primitive approximants near 1.8°, sorted by system size
  approximants:
  #- {m: 18,  r: 1}
  - {m: 54,  r: 3}
  - {m: 71,  r: 4}
  - {m: 89,  r: 5}
  - {m: 107, r: 6}
  - {m: 125, r: 7}
  - {m: 143, r: 8}
  - {m: 161,  r: 9}
  - {m: 178,  r: 10}
  - {m: 179,  r: 10}
  - {m: 196,  r: 11}
  - {m: 197,  r: 11}
  - {m: 214,  r: 12}
  - {m: 232,  r: 13}
  - {m: 233,  r: 13}
  - {m: 250,  r: 14}
  - {m: 251,  r: 14}
  - {m: 267,  r: 15}
  - {m: 268,  r: 15}
  - {m: 269,  r: 15}
  - {m: 285,  r: 16}
  - {m: 286,  r: 16}



tb:
  # ------------------------------------------------------------------
  # Tight-binding parameters
  # ------------------------------------------------------------------
  acc: 1.42                    # intralayer carbon–carbon bond length [Å]
  dperp: 3.35                  # interlayer spacing [Å]
  t: 2.79                      # intralayer hopping [eV]
  tp: 0.35                # interlayer hopping [eV]
  E_in_t: true                 # energy units expressed in t
  registration: AB             # top-layer registration ("AA" or "AB")
  interlayer_mode: baseline    # "baseline" or "stronger" SK decay

window:
  # ------------------------------------------------------------------
  # Energy window and solver settings
  # ------------------------------------------------------------------
  E_window: [-0.1, 0.0]        # energy range around neutrality [in t units]
  sigmas: [-0.08,-0.06,-0.04,-0.02,-0.01,-0.0]    # Gaussian smoothing widths for DOS (if used)
  k_per_slice: 100               # unused in PBC run
  n_states_target: 1200         # target number of eigenstates

  # ------------------------------------------------------------------
  # Extra knobs used by run_pbc_conductance.py
  # ------------------------------------------------------------------
  E_center: -0.5              # Fermi energy where G(E_F) is evaluated (in t units)
  mu_lead: 0                # onsite shift in leads so they are metallic at E_F



# ----------------------------------------------------------------------
# Typical commensurate sequence for reference:
#   (m,r) = (6,1)  → θ ≈ 3.89°
#   (m,r) = (9,1)  → θ ≈ 2.65°
#   (m,r) = (12,1) → θ ≈ 2.13°
#   (m,r) = (18,1) → θ ≈ 1.79°
#   (m,r) = (27,1) → θ ≈ 1.19°
# ----------------------------------------------------------------------
